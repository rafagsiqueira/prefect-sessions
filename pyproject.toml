[project]
name = "prefect-aca-sessions"
version = "0.1.0"
description = "Prefect worker that runs flow runs in Azure Container Apps dynamic sessions"
readme = "README.md"
authors = [
    { name = "Rafael Guimaraes Siqueira", email = "rafasiqueira@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "httpx>=0.28.1",
    "prefect>=3.8.8",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.entry-points."prefect.collections"]
prefect_aca_sessions = "prefect_aca_sessions"

[tool.pytest.ini_options]
asyncio_mode = "auto"
